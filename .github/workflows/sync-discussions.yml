name: Sync Discussions

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch discussions list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -m 60 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/discussions?per_page=10" \
            -o discussions.json

      - name: Validate JSON
        run: |
          python3 - <<'EOF'
          import json
          with open('discussions.json', encoding='utf-8') as f:
              data = json.load(f)
          assert isinstance(data, list), 'not a list'
          print('OK, discussions count:', len(data))
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discussions.json
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: sync discussions list [skip ci]"
            git push
          fi
